<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="alternate" hreflang="he" href="https://inplace.digital/" />
    <link rel="alternate" hreflang="en" href="https://inplace.digital/en/" />
    <link rel="alternate" hreflang="x-default" href="https://inplace.digital/en/" />
    <title>InPlace: בדיקת חשבוניות מול הזמנות, לפני התשלום</title>
    <meta
      name="description"
      content="מערכת רכש עד תשלום בעברית מלאה. כל הזמנה, קבלת סחורה וחשבונית בשרשרת אחת, עם בדיקה אוטומטית שעוצרת את מה שלא מתאים לפני שמשלמים."
    />
    <meta name="theme-color" content="#fffcf8" />
    <!--
      The view, before the first paint.
      Which of the page's two grounds is underneath is one attribute on <html>
      (see `:root[data-theme="light"]` in src/styles.css). React sets that
      attribute too, but a React effect runs AFTER the first frame, so a reader
      who chose the light view would watch a dark page arrive first. This runs
      in the head, before anything is painted, and there is nothing smaller that
      does the job.
    -->
    <script>
      try {
        // Light is the home state as of 01.09.2026. The stylesheet still writes
        // the dark tokens on the bare `:root`, because that is where Tailwind's
        // own layer lands and the light set outranks it from
        // `:root[data-theme='light']`. So the default is expressed here, as an
        // attribute written before the first paint, rather than by moving two
        // hundred tokens between two blocks: everything is light unless the
        // reader has chosen dark.
        // Written in BOTH branches, not only the light one. The bare `:root`
        // still carries the dark tokens, so a dark page renders correctly with
        // no attribute at all — but `readTheme()` in src/lib/theme.ts reads the
        // attribute, and an absent one reads as the default. Leaving it off for
        // dark told the toggle and the shader ground that the page was light
        // while the page was black.
        var stored = localStorage.getItem('inplace.theme')
        var theme = stored === 'dark' ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', theme === 'dark' ? '#0a171d' : '#fffcf8')
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <!--
      One page, one address.
      Without this line the same document is reachable as inplace.digital, as
      www.inplace.digital, with a trailing slash and without, and with any query
      string anybody cares to append. Each of those is a separate page as far as
      a crawler is concerned, and they compete with each other.
    -->
    <link rel="canonical" href="https://inplace.digital/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
    <!--
      /favicon.ico rather than /assets/favicon.ico: browsers and several crawlers
      ask for the root path whether it is declared or not, and before this file
      existed that request was a 404 on every visit.
    -->
    <link rel="icon" sizes="any" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/assets/icon-192.png" />
    <meta property="og:title" content="InPlace: בדיקת חשבוניות מול הזמנות, לפני התשלום" />
    <meta
      property="og:description"
      content="מערכת רכש עד תשלום בעברית מלאה. כל הזמנה, קבלת סחורה וחשבונית בשרשרת אחת, עם בדיקה אוטומטית שעוצרת את מה שלא מתאים לפני שמשלמים."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://inplace.digital/" />
    <meta property="og:site_name" content="InPlace" />
    <meta property="og:locale" content="he_IL" />
    <!--
      The other edition, named. en/index.html has declared its Hebrew twin here
      since it was written; this page did not declare its English one, so a
      chat client reading the pair was told the relationship in one direction
      only.
    -->
    <meta property="og:locale:alternate" content="en_US" />
    <!--
      The share card. Built by scripts/build-og.mjs out of scripts/og-template.html,
      so the picture that represents this page in a chat window is reviewable and
      rebuildable rather than a binary somebody exported once.
    -->
    <meta property="og:image" content="https://inplace.digital/assets/og-cover.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="InPlace: כל מה שקורה בין ההזמנה לכסף, במקום אחד"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="InPlace: רכש, חשבוניות ותשלומים במקום אחד" />
    <meta
      name="twitter:description"
      content="מערכת רכש עד תשלום בעברית מלאה. כל הזמנה, קבלת סחורה וחשבונית בשרשרת אחת, עם בדיקה אוטומטית שעוצרת את מה שלא מתאים לפני שמשלמים."
    />
    <meta name="twitter:image" content="https://inplace.digital/assets/og-cover.jpg" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/assets/fonts/NotoSansHebrew-Hebrew.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/assets/fonts/Heebo-hebrew.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/assets/fonts/RobotoMono-latin.woff2"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; color: #a7bcc1; font-family: Arial, sans-serif">
        הדף הזה כולל סרטון שנע עם הגלילה. גם בלי JavaScript אפשר לקרוא את כל מה
        שהמערכת עושה, ולפתוח חשבון ב־<a
          href="https://app.inplace.digital/signup"
          style="color: #38b3c0"
          >app.inplace.digital</a
        >.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
