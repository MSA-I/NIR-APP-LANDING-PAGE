# Tell Bing, Yandex and Naver that the site changed, after every deploy.
#
# The owner's decision of 28.08.2026 was that this must fire by itself. It
# therefore runs on a push to main and waits before it calls, because
# Cloudflare Pages starts its own build from the same push and this must not
# announce pages the deploy has not finished publishing.
#
# It reads the LIVE sitemap rather than building one, so it can only ever
# announce what is actually being served. If the site is not up — as of
# 28.08.2026 the domain does not resolve at all — the script says so and exits
# 0. A notification that did not go out is not a broken build.
#
# Google does not participate in IndexNow. Nothing here changes anything in
# Google Search.

name: IndexNow

on:
  push:
    branches: [main]
  # So it can be fired by hand the first time the domain goes live, without
  # having to invent a commit for it.
  workflow_dispatch:

# One at a time, and never two announcements of the same site racing each other.
concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Four minutes. Cloudflare Pages builds this site in about ninety seconds
      # from a cold cache; the margin is there so the sitemap this reads is the
      # one the push produced and not the one before it.
      - name: Wait for the deploy to land
        run: sleep 240

      # No `npm ci`: the script uses nothing but Node's own fetch and fs.
      - name: Submit the live sitemap to IndexNow
        run: node scripts/ping-indexnow.mjs
